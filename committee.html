<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>কমিটি — শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.com-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
.com-card-header{background:linear-gradient(135deg,#1C2B39,#2a3f52);color:var(--paper);padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.com-card-header h3{font-family:'Fraunces',serif;font-size:1.1rem;margin-bottom:4px;}
.com-card-meta{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:rgba(243,238,226,.6);}
.com-card-body{padding:16px 20px;}
.member-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
.member-row:last-child{border-bottom:none;}
.member-photo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--brass);flex-shrink:0;}
.member-photo-ph{width:40px;height:40px;border-radius:50%;background:rgba(169,121,60,.15);border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.member-info{flex:1;}
.member-info strong{display:block;font-size:.93rem;}
.member-info span{font-size:.78rem;color:var(--muted);}
.pos-badge{font-size:.72rem;padding:2px 10px;border-radius:20px;background:rgba(169,121,60,.12);color:var(--brass-dark);border:1px solid rgba(169,121,60,.25);white-space:nowrap;}
</style>
</head>
</head>
<body>
<div id="navRoot"></div>
<main class="wrap">
  <div class="page-toolbar">
    <div class="section-label">পরিচালনা কমিটি</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn small outline" onclick="printCommittee()">🖨️ প্রিন্ট</button>
      <div id="refreshBtnRoot"></div>
    </div>
  </div>

  <!-- অ্যাডমিন: নতুন কমিটি -->
  <div id="adminBlock" class="admin-only-block" style="display:none;margin-bottom:24px;">
    <span class="admin-badge">নতুন কমিটি তৈরি করুন</span>
    <div class="grid-2">
      <div><label>কমিটির নাম *</label><input id="comName" placeholder="যেমন: ২০২৫-২৬ কার্যনির্বাহী কমিটি"/></div>
      <div><label>বিবরণ</label><input id="comDescr" placeholder="ঐচ্ছিক"/></div>
      <div><label>শুরুর তারিখ</label><input id="comStart" type="date"/></div>
      <div><label>শেষ তারিখ</label><input id="comEnd" type="date"/></div>
    </div>
    <button class="btn brass" style="margin-top:16px;" onclick="createCommittee()">কমিটি তৈরি করুন</button>
  </div>

  <div id="committeeList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">এখনো কোনো কমিটি তৈরি করা হয়নি।</div>
</main>

<!-- সদস্য যোগের modal -->
<div id="addMemberModalRoot"></div>
<div id="adminModalRoot"></div>
<div class="footer">শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার · কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
renderNav('committee.html');
renderRefreshBtn(loadCommittees);

var _committees = [], _allMembers = [], _panelData = {};

function onAdminStateChange() {
  document.getElementById('adminBlock').style.display = isAdmin() ? 'block' : 'none';
}

// ===== সব কমিটি লোড =====
async function loadCommittees() {
  var res = await Promise.all([Api.get('listCommittees'), Api.get('listMembers')]);
  _committees = res[0] || [];
  _allMembers = res[1] || [];

  var el    = document.getElementById('committeeList');
  var empty = document.getElementById('emptyState');

  if (!_committees.length) { el.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  el.innerHTML = _committees.map(function(com) {
    var dateRange = '';
    if (com.StartDate || com.EndDate) {
      dateRange = (com.StartDate ? fmtDate(com.StartDate) : '') +
        (com.EndDate ? ' — ' + fmtDate(com.EndDate) : '');
    }
    var adminBtns = isAdmin()
      ? '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button class="btn small outline" style="border-color:rgba(255,255,255,.3);color:var(--paper);" onclick="openAddMember(\'' + com.ID + '\')">+ সদস্য যোগ করুন</button>' +
          '<button class="btn small" style="background:var(--rust);" onclick="deleteCommittee(\'' + com.ID + '\')">ডিলিট</button>' +
        '</div>'
      : '';
    return '<div class="com-card" id="com-' + com.ID + '">' +
      '<div class="com-card-header">' +
        '<div>' +
          '<h3>' + com.Name + '</h3>' +
          (com.Description ? '<div class="com-card-meta">' + com.Description + '</div>' : '') +
          (dateRange ? '<div class="com-card-meta" style="margin-top:4px;">📅 ' + dateRange + '</div>' : '<div class="com-card-meta">মেয়াদ অনির্ধারিত</div>') +
        '</div>' +
        adminBtns +
      '</div>' +
      '<div class="com-card-body" id="panel-' + com.ID + '">' +
        '<div style="color:var(--muted);font-size:.85rem;padding:8px 0;">সদস্য লোড হচ্ছে...</div>' +
      '</div>' +
    '</div>';
  }).join('');

  // প্রতিটা কমিটির সদস্য লোড
  _committees.forEach(function(com) {
    loadCommitteePanel(com.ID);
  });
}

// ===== কমিটির সদস্য লোড =====
async function loadCommitteePanel(committeeId) {
  var members = await Api.get('listCommitteeMembers', { committeeId: committeeId });
  var panel   = document.getElementById('panel-' + committeeId);
  if (!panel) return;
  _panelData[committeeId] = members || [];

  if (!members || !members.length) {
    panel.innerHTML = '<div style="color:var(--muted);font-size:.85rem;padding:8px 0;">এই কমিটিতে এখনো কোনো সদস্য নেই।</div>';
    return;
  }

  panel.innerHTML = members.map(function(m) {
    var photo = m.photoURL
      ? '<img class="member-photo" src="' + m.photoURL + '" />'
      : '<div class="member-photo-ph">👤</div>';
    var adminDel = isAdmin()
      ? ' <button class="btn small" style="background:var(--rust);margin-left:auto;" onclick="removeMember(\'' + m.id + '\',\'' + committeeId + '\')">বাদ দিন</button>'
      : '';
    return '<div class="member-row">' +
      photo +
      '<div class="member-info"><strong>' + m.name + '</strong><span class="mono">' + m.memberID + (m.phone ? ' · ' + m.phone : '') + '</span></div>' +
      '<span class="pos-badge">' + m.position + '</span>' +
      adminDel +
    '</div>';
  }).join('');
}

// ===== সদস্য যোগের modal =====
function openAddMember(committeeId) {
  var memberOptions = _allMembers.map(function(m) {
    return '<option value="' + m.ID + '">' + m.Name + ' (' + m.ID + ')</option>';
  }).join('');
  var posOptions = ['সভাপতি','সহ-সভাপতি','সাধারণ সম্পাদক','যুগ্ম সাধারণ সম্পাদক','সাংগঠনিক সম্পাদক',
    'অর্থ সম্পাদক','কোষাধ্যক্ষ','লাইব্রেরিয়ান','প্রচার সম্পাদক','ত্রাণ ও সমাজকল্যাণ সম্পাদক',
    'ক্রীড়া ও সাংস্কৃতিক সম্পাদক','কার্যনির্বাহী সদস্য','উপদেষ্টা','অন্যান্য'].map(function(p) {
    return '<option value="' + p + '">' + p + '</option>';
  }).join('');

  document.getElementById('addMemberModalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="closeAddMember(event)">' +
      '<div class="modal" style="max-width:420px;" onclick="event.stopPropagation()">' +
        '<h3 style="margin-bottom:16px;">কমিটিতে সদস্য যোগ করুন</h3>' +
        '<label>সদস্য নির্বাচন করুন *</label>' +
        '<select id="amMember" style="margin-bottom:14px;"><option value="">— সদস্য বাছাই করুন —</option>' + memberOptions + '</select>' +
        '<label>পদবি *</label>' +
        '<select id="amPosition" style="margin-bottom:10px;"><option value="">— পদবি বাছাই করুন —</option>' + posOptions + '</select>' +
        '<label>কাস্টম পদবি (উপরে না পেলে)</label>' +
        '<input id="amCustomPos" placeholder="নিজে লিখুন..." style="margin-bottom:18px;" />' +
        '<div style="display:flex;gap:10px;">' +
          '<button class="btn brass" style="flex:1;" onclick="submitAddMember(\'' + committeeId + '\')">যোগ করুন</button>' +
          '<button class="btn outline" onclick="closeAddMember()">বাতিল</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.style.overflow = 'hidden';
}

function closeAddMember(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('addMemberModalRoot').innerHTML = '';
  document.body.style.overflow = '';
}

async function submitAddMember(committeeId) {
  var memberID = document.getElementById('amMember').value;
  var position = document.getElementById('amCustomPos').value.trim() || document.getElementById('amPosition').value;
  if (!memberID) { Toast.error('সদস্য বাছাই করুন'); return; }
  if (!position) { Toast.error('পদবি দিন'); return; }
  Toast.loading('যোগ করা হচ্ছে...');
  var res = await Api.post('addCommitteeMember', { committeeId: committeeId, memberID: memberID, position: position });
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('সদস্য যোগ করা হয়েছে ✓');
  closeAddMember();
  loadCommitteePanel(committeeId);
}

async function removeMember(id, committeeId) {
  if (!await Dialog.confirm('এই সদস্যকে কমিটি থেকে বাদ দিতে চান?')) return;
  var res = await Api.post('deleteCommitteeMember', { id: id });
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('সদস্য বাদ দেওয়া হয়েছে।');
  loadCommitteePanel(committeeId);
}

// ===== কমিটি তৈরি =====
async function createCommittee() {
  var name = document.getElementById('comName').value.trim();
  if (!name) { Toast.error('কমিটির নাম দিন'); return; }
  Toast.loading('তৈরি হচ্ছে...');
  var res = await Api.post('addCommittee', {
    name:      name,
    descr:     document.getElementById('comDescr').value.trim(),
    startDate: document.getElementById('comStart').value,
    endDate:   document.getElementById('comEnd').value,
  });
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('কমিটি তৈরি হয়েছে ✓');
  ['comName','comDescr','comStart','comEnd'].forEach(function(id){ document.getElementById(id).value=''; });
  loadCommittees();
}

// ===== কমিটি ডিলিট =====
async function deleteCommittee(id) {
  if (!await Dialog.confirm('এই কমিটি ও সব সদস্য মুছে ফেলতে চান?', { okText: 'হ্যাঁ, মুছুন' })) return;
  var res = await Api.post('deleteCommitteeRecord', { id: id });
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('কমিটি মুছে ফেলা হয়েছে।');
  loadCommittees();
}

// ===== প্রিন্ট =====
function printCommittee() {
  var rows = '';
  _committees.forEach(function(com) {
    var mems = _panelData[com.ID] || [];
    if (!mems.length) return;
    mems.forEach(function(m, i) {
      rows += '<tr>' +
        (i===0?'<td rowspan="'+mems.length+'" style="font-weight:600;vertical-align:top;">'+com.Name+'</td>':'') +
        '<td>'+(i+1)+'</td><td>'+m.memberID+'</td><td>'+m.name+'</td><td>'+m.position+'</td>' +
      '</tr>';
    });
  });
  var html = '<table><thead><tr><th>কমিটি</th><th>#</th><th>আইডি</th><th>নাম</th><th>পদবি</th></tr></thead><tbody>' + rows + '</tbody></table>';
  PrintUtil.print('পরিচালনা কমিটি', html, '<span>মোট কমিটি: ' + _committees.length + 'টি</span>');
}

onAdminStateChange();
loadCommittees();
</script>
</body>
</html>
