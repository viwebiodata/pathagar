<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>কমিটি — শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* modern professional reset & variables */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f6f3ee;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1e2b39;
      padding: 0;
    }
    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 28px 10px;
    }
    /* header – library info */
    .library-header {
      background: linear-gradient(145deg, #1C2B39 0%, #2a3f52 100%);
      color: #f3eee2;
      padding: 20px 28px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .library-header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 1.5rem;
      letter-spacing: 0.3px;
    }
    .library-header .address {
      font-size: 0.9rem;
      opacity: 0.75;
      font-weight: 300;
      margin-top: 4px;
    }
    .library-header .print-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f3eee2;
      padding: 8px 20px;
      border-radius: 40px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(2px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .library-header .print-btn:hover {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.4);
    }
    /* split layout */
    .committee-split {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .committee-sidebar {
      flex: 0 0 320px;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e6dfd6;
      padding: 8px 0;
      max-height: 72vh;
      overflow-y: auto;
      box-shadow: 0 6px 18px rgba(0,0,0,0.02);
    }
    .committee-sidebar .sidebar-header {
      padding: 14px 20px 10px;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #7d7260;
      border-bottom: 1px solid #e6dfd6;
    }
    .com-list-item {
      padding: 14px 20px;
      border-bottom: 1px solid #f0ebe3;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .com-list-item:hover { background: #f8f5f0; }
    .com-list-item.active {
      background: #f0ebe3;
      border-left: 4px solid #a9793c;
      font-weight: 500;
    }
    .com-list-item .com-name { font-size: 0.95rem; }
    .com-list-item .com-badge {
      font-size: 0.65rem;
      background: rgba(169, 121, 60, 0.08);
      padding: 2px 12px;
      border-radius: 30px;
      color: #7a5f2e;
      border: 1px solid rgba(169, 121, 60, 0.12);
    }
    /* right panel – professional card */
    .right-panel {
      flex: 1;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e6dfd6;
      padding: 0;
      min-height: 500px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
    }
    .panel-placeholder {
      padding: 60px 20px;
      text-align: center;
      color: #9a8e7c;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #panelContent {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    /* committee header inside panel */
    .panel-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid #e6dfd6;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      background: #fcfaf8;
      border-radius: 20px 20px 0 0;
    }
    .panel-header .title-group h2 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 1.25rem;
      color: #1e2b39;
      margin-bottom: 2px;
    }
    .panel-header .title-group .panel-meta {
      font-size: 0.78rem;
      color: #7d7260;
      background: #f0ebe3;
      padding: 2px 14px;
      border-radius: 30px;
      display: inline-block;
    }
    .panel-header .admin-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    /* member list */
    .member-list-container {
      padding: 12px 20px 24px;
      flex: 1;
      overflow-y: auto;
    }
    .member-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 6px;
      border-bottom: 1px solid #f0ebe3;
      transition: 0.05s;
    }
    .member-row:last-child { border-bottom: none; }
    .member-photo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #c9b69a;
      flex-shrink: 0;
    }
    .member-photo-ph {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f0ebe3;
      border: 2px solid #c9b69a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #7d7260;
      flex-shrink: 0;
    }
    .member-info {
      flex: 1;
    }
    .member-info strong {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .member-info span {
      font-size: 0.75rem;
      color: #7d7260;
    }
    .pos-badge {
      font-size: 0.7rem;
      padding: 2px 14px;
      border-radius: 40px;
      background: rgba(169, 121, 60, 0.07);
      color: #7a5f2e;
      border: 1px solid rgba(169, 121, 60, 0.15);
      white-space: nowrap;
    }
    /* admin form */
    .admin-only-block {
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid #e6dfd6;
      padding: 18px 24px;
      margin-bottom: 22px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
    .admin-badge {
      background: #1C2B39;
      color: #f3eee2;
      padding: 2px 18px;
      border-radius: 40px;
      font-size: 0.7rem;
      display: inline-block;
      margin-bottom: 14px;
    }
    .btn {
      border-radius: 40px;
      padding: 6px 18px;
      font-weight: 500;
      font-size: 0.8rem;
      border: none;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn.small { font-size: 0.7rem; padding: 4px 14px; }
    .btn.brass { background: #a9793c; color: white; }
    .btn.brass:hover { background: #8f6532; }
    .btn.outline { background: transparent; border: 1px solid #d6cec0; }
    .btn.outline:hover { background: #f4f0ea; }
    .btn.rust { background: #a0443b; color: white; }
    .btn.rust:hover { background: #8a3931; }
    .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #f3eee2; }
    .btn.ghost:hover { background: rgba(255,255,255,0.08); }

    .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .empty-state { padding: 30px 10px; text-align: center; color: #9a8e7c; }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; backdrop-filter: blur(2px);
    }
    .modal {
      background: white; border-radius: 28px; padding: 28px 32px;
      max-width: 440px; width: 92%; box-shadow: 0 30px 50px rgba(0,0,0,0.2);
    }
    .modal label { font-weight: 500; font-size: 0.8rem; display: block; margin: 12px 0 4px; }
    .modal select, .modal input {
      width: 100%; padding: 8px 14px; border-radius: 40px;
      border: 1px solid #ddd6cc; background: white;
    }
    .footer {
      margin-top: 40px; text-align: center; font-size: 0.75rem;
      color: #9a8e7c; border-top: 1px solid #e6dfd6;
      padding: 22px 0 10px;
    }
    @media (max-width: 820px) {
      .committee-split { flex-direction: column; }
      .committee-sidebar { flex: 1 1 auto; width: 100%; max-height: 300px; }
      .grid-2 { grid-template-columns: 1fr; }
      .library-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
    /* print styles */
    @media print {
      body { background: white; }
      .library-header { background: #1C2B39 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .committee-sidebar, .admin-only-block, .panel-header .admin-actions, #refreshBtnRoot, .page-toolbar .btn { display: none !important; }
      .right-panel { border: none; box-shadow: none; }
      .committee-split { display: block; }
      .panel-header { background: #fcfaf8; }
      .member-row { break-inside: avoid; }
      .wrap { padding: 0.2in; }
    }
  </style>
</head>
<body>
  <div id="navRoot"></div>
  <main class="wrap">
    <!-- লাইব্রেরির নাম ও ঠিকানা -->
    <div class="library-header">
      <div>
        <h1>শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</h1>
        <div class="address">কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</div>
      </div>
      <button class="print-btn" onclick="window.print()">🖨️ প্রিন্ট (A4)</button>
    </div>

    <!-- অ্যাডমিন: নতুন কমিটি -->
    <div id="adminBlock" class="admin-only-block" style="display:none;">
      <span class="admin-badge">⚙️ নতুন কমিটি তৈরি করুন</span>
      <div class="grid-2">
        <div><label>কমিটির নাম *</label><input id="comName" placeholder="যেমন: ২০২৫-২৬ কার্যনির্বাহী কমিটি" /></div>
        <div><label>বিবরণ</label><input id="comDescr" placeholder="ঐচ্ছিক" /></div>
        <div><label>শুরুর তারিখ</label><input id="comStart" type="date" /></div>
        <div><label>শেষ তারিখ</label><input id="comEnd" type="date" /></div>
      </div>
      <button class="btn brass" style="margin-top:16px;" onclick="createCommittee()">কমিটি তৈরি করুন</button>
    </div>

    <!-- দুই কলাম -->
    <div class="committee-split">
      <div class="committee-sidebar" id="committeeSidebar">
        <div class="sidebar-header">📋 কমিটি সমূহ</div>
        <div id="committeeListSidebar"></div>
        <div class="empty-state" id="emptyStateSidebar" style="display:none;">কোনো কমিটি নেই</div>
      </div>
      <div class="right-panel" id="rightPanel">
        <div class="panel-placeholder" id="panelPlaceholder">◂ বাম পাশ থেকে একটি কমিটি নির্বাচন করুন</div>
        <div id="panelContent" style="display:none; flex-direction:column; height:100%;">
          <div class="panel-header">
            <div class="title-group">
              <h2 id="panelTitle">কমিটির নাম</h2>
              <div class="panel-meta" id="panelMeta">মেয়াদ</div>
            </div>
            <div class="admin-actions" id="panelAdminActions"></div>
          </div>
          <div class="member-list-container" id="memberListContainer">
            <div style="color:#7d7260;padding:12px 0;">সদস্য লোড হচ্ছে...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="addMemberModalRoot"></div>
  <div id="adminModalRoot"></div>
  <div class="footer">শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার · কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    renderNav('committee.html');
    renderRefreshBtn(loadCommittees);

    var _committees = [], _allMembers = [], _panelData = {}, _selectedCommitteeId = null;

    function onAdminStateChange() {
      document.getElementById('adminBlock').style.display = isAdmin() ? 'block' : 'none';
    }

    async function loadCommittees() {
      var res = await Promise.all([Api.get('listCommittees'), Api.get('listMembers')]);
      _committees = res[0] || [];
      _allMembers = res[1] || [];

      var sidebar = document.getElementById('committeeListSidebar');
      var empty = document.getElementById('emptyStateSidebar');
      if (!_committees.length) {
        sidebar.innerHTML = ''; empty.style.display = 'block';
        document.getElementById('panelContent').style.display = 'none';
        document.getElementById('panelPlaceholder').style.display = 'flex';
        return;
      }
      empty.style.display = 'none';
      sidebar.innerHTML = _committees.map(function(com) {
        var active = (com.ID === _selectedCommitteeId) ? 'active' : '';
        var dateStr = '';
        if (com.StartDate || com.EndDate) {
          dateStr = (com.StartDate ? fmtDate(com.StartDate) : '') + (com.EndDate ? ' — ' + fmtDate(com.EndDate) : '');
        }
        return '<div class="com-list-item ' + active + '" data-id="' + com.ID + '" onclick="selectCommittee(\'' + com.ID + '\')">' +
          '<span class="com-name">' + com.Name + '</span>' +
          '<span class="com-badge">' + (dateStr || 'অনির্ধারিত') + '</span>' +
        '</div>';
      }).join('');

      if (!_selectedCommitteeId && _committees.length) selectCommittee(_committees[0].ID);
      else if (_selectedCommitteeId) {
        var exists = _committees.some(c => c.ID === _selectedCommitteeId);
        if (!exists) selectCommittee(_committees[0]?.ID || null);
        else loadCommitteePanel(_selectedCommitteeId);
      }
    }

    function selectCommittee(committeeId) {
      if (!committeeId) {
        document.getElementById('panelContent').style.display = 'none';
        document.getElementById('panelPlaceholder').style.display = 'flex';
        _selectedCommitteeId = null;
        document.querySelectorAll('.com-list-item').forEach(el => el.classList.remove('active'));
        return;
      }
      _selectedCommitteeId = committeeId;
      document.querySelectorAll('.com-list-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === committeeId);
      });
      document.getElementById('panelPlaceholder').style.display = 'none';
      document.getElementById('panelContent').style.display = 'flex';
      loadCommitteePanel(committeeId);
    }

    async function loadCommitteePanel(committeeId) {
      var members = await Api.get('listCommitteeMembers', { committeeId: committeeId });
      var container = document.getElementById('memberListContainer');
      if (!container) return;
      _panelData[committeeId] = members || [];

      var com = _committees.find(c => c.ID === committeeId);
      if (com) {
        document.getElementById('panelTitle').textContent = com.Name;
        var dateRange = '';
        if (com.StartDate || com.EndDate) {
          dateRange = (com.StartDate ? fmtDate(com.StartDate) : '') + (com.EndDate ? ' — ' + fmtDate(com.EndDate) : '');
        }
        document.getElementById('panelMeta').textContent = dateRange || 'মেয়াদ অনির্ধারিত';
        var adminDiv = document.getElementById('panelAdminActions');
        if (isAdmin()) {
          adminDiv.innerHTML = 
            '<button class="btn small outline" style="border-color:#a9793c;color:#7a5f2e;" onclick="openAddMember(\'' + committeeId + '\')">+ সদস্য যোগ</button>' +
            '<button class="btn small rust" onclick="deleteCommittee(\'' + committeeId + '\')">ডিলিট কমিটি</button>';
        } else adminDiv.innerHTML = '';
      }

      if (!members || !members.length) {
        container.innerHTML = '<div style="color:#7d7260;padding:20px 0;">এই কমিটিতে এখনো কোনো সদস্য নেই।</div>';
        return;
      }

      container.innerHTML = members.map(function(m) {
        var photo = m.photoURL
          ? '<img class="member-photo" src="' + m.photoURL + '" alt="photo" />'
          : '<div class="member-photo-ph">👤</div>';
        var adminDel = isAdmin()
          ? ' <button class="btn small rust" style="margin-left:auto;" onclick="removeMember(\'' + m.id + '\',\'' + committeeId + '\')">বাদ দিন</button>'
          : '';
        return '<div class="member-row">' +
          photo +
          '<div class="member-info"><strong>' + m.name + '</strong><span class="mono">' + m.memberID + (m.phone ? ' · ' + m.phone : '') + '</span></div>' +
          '<span class="pos-badge">' + m.position + '</span>' +
          adminDel +
        '</div>';
      }).join('');
    }

    // ===== সদস্য যোগ =====
    function openAddMember(committeeId) {
      var memberOptions = _allMembers.map(function(m) {
        return '<option value="' + m.ID + '">' + m.Name + ' (' + m.ID + ')</option>';
      }).join('');
      var posOptions = ['সভাপতি','সহ-সভাপতি','সাধারণ সম্পাদক','যুগ্ম সাধারণ সম্পাদক','সাংগঠনিক সম্পাদক',
        'অর্থ সম্পাদক','কোষাধ্যক্ষ','লাইব্রেরিয়ান','প্রচার সম্পাদক','ত্রাণ ও সমাজকল্যাণ সম্পাদক',
        'ক্রীড়া ও সাংস্কৃতিক সম্পাদক','কার্যনির্বাহী সদস্য','উপদেষ্টা','অন্যান্য'
      ].map(p => '<option value="' + p + '">' + p + '</option>').join('');

      document.getElementById('addMemberModalRoot').innerHTML =
        '<div class="modal-backdrop" onclick="closeAddMember(event)">' +
        '<div class="modal" onclick="event.stopPropagation()">' +
        '<h3 style="margin-bottom:16px;">কমিটিতে সদস্য যোগ করুন</h3>' +
        '<label>সদস্য নির্বাচন করুন *</label>' +
        '<select id="amMember" style="margin-bottom:14px;"><option value="">— সদস্য বাছাই করুন —</option>' + memberOptions + '</select>' +
        '<label>পদবি *</label>' +
        '<select id="amPosition" style="margin-bottom:10px;"><option value="">— পদবি বাছাই করুন —</option>' + posOptions + '</select>' +
        '<label>কাস্টম পদবি (উপরে না পেলে)</label>' +
        '<input id="amCustomPos" placeholder="নিজে লিখুন..." style="margin-bottom:18px;" />' +
        '<div style="display:flex;gap:10px;">' +
        '<button class="btn brass" style="flex:1;" onclick="submitAddMember(\'' + committeeId + '\')">যোগ করুন</button>' +
        '<button class="btn outline" onclick="closeAddMember()">বাতিল</button>' +
        '</div></div></div>';
      document.body.style.overflow = 'hidden';
    }

    function closeAddMember(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('addMemberModalRoot').innerHTML = ''; document.body.style.overflow = ''; }

    async function submitAddMember(committeeId) {
      var memberID = document.getElementById('amMember').value;
      var position = document.getElementById('amCustomPos').value.trim() || document.getElementById('amPosition').value;
      if (!memberID) { Toast.error('সদস্য বাছাই করুন'); return; }
      if (!position) { Toast.error('পদবি দিন'); return; }
      Toast.loading('যোগ করা হচ্ছে...');
      var res = await Api.post('addCommitteeMember', { committeeId, memberID, position });
      if (res.error) { Toast.error(res.error); return; }
      Toast.success('সদস্য যোগ করা হয়েছে ✓');
      closeAddMember();
      loadCommitteePanel(committeeId);
    }

    async function removeMember(id, committeeId) {
      if (!await Dialog.confirm('এই সদস্যকে কমিটি থেকে বাদ দিতে চান?')) return;
      var res = await Api.post('deleteCommitteeMember', { id });
      if (res.error) { Toast.error(res.error); return; }
      Toast.success('সদস্য বাদ দেওয়া হয়েছে।');
      loadCommitteePanel(committeeId);
    }

    // ===== কমিটি তৈরি / ডিলিট =====
    async function createCommittee() {
      var name = document.getElementById('comName').value.trim();
      if (!name) { Toast.error('কমিটির নাম দিন'); return; }
      Toast.loading('তৈরি হচ্ছে...');
      var res = await Api.post('addCommittee', {
        name, descr: document.getElementById('comDescr').value.trim(),
        startDate: document.getElementById('comStart').value,
        endDate: document.getElementById('comEnd').value,
      });
      if (res.error) { Toast.error(res.error); return; }
      Toast.success('কমিটি তৈরি হয়েছে ✓');
      ['comName','comDescr','comStart','comEnd'].forEach(id => document.getElementById(id).value = '');
      loadCommittees();
    }

    async function deleteCommittee(id) {
      if (!await Dialog.confirm('এই কমিটি ও সব সদস্য মুছে ফেলতে চান?', { okText: 'হ্যাঁ, মুছুন' })) return;
      var res = await Api.post('deleteCommitteeRecord', { id });
      if (res.error) { Toast.error(res.error); return; }
      Toast.success('কমিটি মুছে ফেলা হয়েছে।');
      if (_selectedCommitteeId === id) { _selectedCommitteeId = null; document.getElementById('panelContent').style.display = 'none'; document.getElementById('panelPlaceholder').style.display = 'flex'; }
      loadCommittees();
    }

    onAdminStateChange();
    loadCommittees();
  </script>
</body>
</html>
