<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>সদস্য তালিকা — শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</title>
<link rel="stylesheet" href="css/style.css" />
<style>
/* সদস্য কার্ড popup */
.id-card-backdrop {
  position:fixed;inset:0;background:rgba(28,43,57,.6);backdrop-filter:blur(4px);
  z-index:8000;display:flex;align-items:center;justify-content:center;padding:16px;
  animation:_tin .2s ease;
}
.id-card {
  width:100%;max-width:380px;background:#fff;border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);overflow:hidden;
  animation:_tin .25s cubic-bezier(.34,1.56,.64,1);
  font-family:'Hind Siliguri',sans-serif;
}
.id-card-header {
  background:linear-gradient(135deg,#1C2B39 0%,#2a3f52 100%);
  padding:20px 22px 16px;display:flex;align-items:center;gap:16px;
  position:relative;
}
.id-card-header::after {
  content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#A9793C,#C49A55,#A9793C);
}
.id-card-photo {
  width:72px;height:72px;border-radius:50%;object-fit:cover;
  border:3px solid #A9793C;flex-shrink:0;background:#2a3f52;
}
.id-card-photo-placeholder {
  width:72px;height:72px;border-radius:50%;
  background:rgba(169,121,60,.25);border:3px solid #A9793C;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;flex-shrink:0;
}
.id-card-name { color:#F3EEE2;font-family:'Fraunces',serif;font-size:1.15rem;font-weight:700;margin-bottom:4px; }
.id-card-id   { color:#A9793C;font-family:'IBM Plex Mono',monospace;font-size:.78rem; }
.id-card-role { display:inline-block;margin-top:6px;padding:2px 10px;border-radius:20px;
                font-size:.72rem;background:rgba(169,121,60,.2);color:#C49A55;border:1px solid rgba(169,121,60,.4); }
.id-card-org  { position:absolute;top:14px;right:16px;text-align:right; }
.id-card-org .org-name { color:rgba(243,238,226,.6);font-size:.65rem;line-height:1.4;max-width:110px; }

.id-card-body { padding:18px 22px; }
.id-row { display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f0ebe0; }
.id-row:last-child { border-bottom:none; }
.id-label { font-size:.75rem;color:#9A9186;min-width:90px;flex-shrink:0;padding-top:2px;font-family:'IBM Plex Mono',monospace; }
.id-value { font-size:.9rem;color:#1C2B39;font-weight:500;word-break:break-word; }
.id-blood  { display:inline-block;padding:2px 10px;border-radius:20px;font-size:.85rem;font-weight:700;
             background:rgba(154,59,59,.1);color:var(--rust);border:1px solid rgba(154,59,59,.2); }

.id-card-footer {
  background:#F9F6EF;padding:12px 22px;display:flex;justify-content:space-between;
  align-items:center;border-top:1px solid #e8e0d0;
}
.id-card-footer .reg-date { font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:#9A9186; }

/* টেবিল row hover */
#memberBody tr { cursor:pointer;transition:background .12s; }
#memberBody tr:hover { background:rgba(169,121,60,.06); }
</style>
</head>
<body>
<div id="navRoot"></div>

<main class="wrap">
  <div class="page-toolbar">
    <div class="section-label">সদস্য তালিকা</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn small outline" onclick="printMembers()">🖨️ প্রিন্ট / PDF</button>
      <div id="refreshBtnRoot"></div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;">
    <input id="memberSearch" placeholder="নাম, আইডি বা গ্রাম দিয়ে খুঁজুন..." style="max-width:320px;" oninput="renderMembers()" />
    <a href="register.html" class="btn brass" style="white-space:nowrap;">+ নতুন সদস্য</a>
  </div>

  <div class="table-scroll"><table>
    <thead>
      <tr>
        <th>ছবি</th><th>আইডি</th><th>নাম</th><th>পদবি</th>
        <th>গ্রাম</th><th>রক্ত</th><th>ফোন</th>
        <th id="actionsHeader" style="display:none;"></th>
      </tr>
    </thead>
    <tbody id="memberBody"></tbody>
  </table></div>
  <div class="empty-state" id="memberEmpty" style="display:none;">কোনো সদস্য নেই।</div>
</main>

<!-- ID Card Modal -->
<div id="idCardRoot"></div>
<div id="editModalRoot"></div>
<div id="adminModalRoot"></div>
<div class="footer">শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার · কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
renderNav('members.html');
renderRefreshBtn(loadMembers);

let allMembers = [], committeeByMember = {}, editPhotoDataUrl = '';

function onAdminStateChange() {
  document.getElementById('actionsHeader').style.display = isAdmin() ? '' : 'none';
  renderMembers();
}

// ===== সদস্য আইডি কার্ড popup =====
function openMemberCard(id) {
  const m = allMembers.find(function(x){ return x.ID === id; });
  if (!m) return;

  const photo = m.PhotoURL
    ? '<img class="id-card-photo" src="' + m.PhotoURL + '" alt="' + m.Name + '" />'
    : '<div class="id-card-photo-placeholder">👤</div>';

  const role = committeeByMember[m.ID] || m.MemberType || 'সাধারণ সদস্য';
  const blood = m.BloodGroup
    ? '<span class="id-blood">' + m.BloodGroup + '</span>'
    : '—';

  function row(label, val) {
    if (!val || val === '—') return '';
    return '<div class="id-row"><span class="id-label">' + label + '</span><span class="id-value">' + val + '</span></div>';
  }

  const adminActions = isAdmin()
    ? '<button class="btn small outline" onclick="closeCard();openEdit(\'' + m.ID + '\')">এডিট</button> ' +
      '<button class="btn small" style="background:var(--rust);" onclick="closeCard();removeMember(\'' + m.ID + '\')">ডিলিট</button>'
    : '<button class="btn small outline" onclick="closeCard()">বন্ধ করুন</button>';

  const backdrop = document.createElement('div');
  backdrop.className = 'id-card-backdrop';
  backdrop.id = 'idBackdrop';
  backdrop.onclick = function(e) { if (e.target === backdrop) closeCard(); };

  backdrop.innerHTML =
    '<div class="id-card">' +
      '<div class="id-card-header">' +
        photo +
        '<div>' +
          '<div class="id-card-name">' + m.Name + '</div>' +
          '<div class="id-card-id">' + m.ID + '</div>' +
          '<span class="id-card-role">' + role + '</span>' +
        '</div>' +
        '<div class="id-card-org">' +
          '<div class="org-name">শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</div>' +
        '</div>' +
      '</div>' +
      '<div class="id-card-body">' +
        row('বাবার নাম', m.FatherName) +
        row('মায়ের নাম', m.MotherName) +
        row('গ্রাম / ঠিকানা', m.Village) +
        row('জন্ম তারিখ', m.DOB ? fmtDate(m.DOB) : '') +
        row('শিক্ষা', m.Education) +
        row('পেশা', m.Occupation) +
        '<div class="id-row"><span class="id-label">রক্তের গ্রুপ</span><span class="id-value">' + blood + '</span></div>' +
        row('ধর্ম', m.Religion) +
        row('ফোন', m.Phone) +
        row('চাঁদা', m.FeeAmount ? '৳' + m.FeeAmount : '') +
      '</div>' +
      '<div class="id-card-footer">' +
        '<div class="reg-date">নিবন্ধন: ' + fmtDate(m.RegDate) + '</div>' +
        '<div>' + adminActions + '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('idCardRoot').innerHTML = '';
  document.getElementById('idCardRoot').appendChild(backdrop);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', cardKeyHandler);
}

function closeCard() {
  document.getElementById('idCardRoot').innerHTML = '';
  document.body.style.overflow = '';
  document.removeEventListener('keydown', cardKeyHandler);
}
function cardKeyHandler(e) { if (e.key === 'Escape') closeCard(); }

// ===== রেন্ডার =====
function renderMembers() {
  const q = document.getElementById('memberSearch').value.trim().toLowerCase();
  const list = q
    ? allMembers.filter(function(m) {
        return String(m.Name).toLowerCase().includes(q) ||
               String(m.ID).toLowerCase().includes(q) ||
               String(m.Village||'').toLowerCase().includes(q);
      })
    : allMembers;

  const body  = document.getElementById('memberBody');
  const empty = document.getElementById('memberEmpty');
  document.getElementById('actionsHeader').style.display = isAdmin() ? '' : 'none';

  if (!list.length) { body.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  body.innerHTML = list.map(function(m) {
    const photo = m.PhotoURL
      ? '<img src="' + m.PhotoURL + '" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--brass);" />'
      : '<div style="width:36px;height:36px;border-radius:50%;background:rgba(169,121,60,.15);display:flex;align-items:center;justify-content:center;font-size:1rem;">👤</div>';
    const role    = committeeByMember[m.ID] || m.MemberType || 'সাধারণ সদস্য';
    const actions = isAdmin()
      ? '<button class="btn small outline" onclick="event.stopPropagation();openEdit(\'' + m.ID + '\')">এডিট</button> ' +
        '<button class="btn small" style="background:var(--rust);" onclick="event.stopPropagation();removeMember(\'' + m.ID + '\')">ডিলিট</button>'
      : '';
    return '<tr onclick="openMemberCard(\'' + m.ID + '\')" title="বিস্তারিত দেখুন">' +
      '<td>' + photo + '</td>' +
      '<td class="mono">' + m.ID + '</td>' +
      '<td><strong>' + m.Name + '</strong>' + (m.FatherName?'<br><span style="color:var(--muted);font-size:.78rem;">' + m.FatherName + '</span>':'') + '</td>' +
      '<td><span class="tag ' + (committeeByMember[m.ID]?'role':'available') + '">' + role + '</span></td>' +
      '<td>' + (m.Village||'—') + '</td>' +
      '<td><span style="font-weight:700;color:var(--rust);font-family:\'IBM Plex Mono\',monospace;">' + (m.BloodGroup||'—') + '</span></td>' +
      '<td class="mono" style="font-size:.82rem;">' + (m.Phone||'—') + '</td>' +
      (isAdmin() ? '<td style="white-space:nowrap;" onclick="event.stopPropagation();">' + actions + '</td>' : '') +
    '</tr>';
  }).join('');
}

// ===== লোড =====
async function loadMembers() {
  const [members, committee] = await Promise.all([
    Api.get('listMembers'),
    Api.get('listCommittee'),
  ]);
  allMembers = members || [];
  committeeByMember = {};
  (committee || []).forEach(function(c) {
    committeeByMember[c.MemberID] = c.Position;
  });
  renderMembers();
}

// ===== প্রিন্ট =====
function printMembers() {
  const q    = document.getElementById('memberSearch').value.trim().toLowerCase();
  const list = q ? allMembers.filter(function(m){ return m.Name.toLowerCase().includes(q)||m.ID.includes(q); }) : allMembers;
  const html = '<table><thead><tr><th>আইডি</th><th>নাম</th><th>বাবার নাম</th><th>গ্রাম</th><th>পেশা</th><th>রক্তের গ্রুপ</th><th>পদবি</th><th>ফোন</th><th>চাঁদা</th></tr></thead><tbody>' +
    list.map(function(m){ return '<tr><td>'+m.ID+'</td><td>'+m.Name+'</td><td>'+(m.FatherName||'—')+'</td><td>'+(m.Village||'—')+'</td><td>'+(m.Occupation||'—')+'</td><td>'+(m.BloodGroup||'—')+'</td><td>'+(committeeByMember[m.ID]||m.MemberType||'সাধারণ')+'</td><td>'+(m.Phone||'—')+'</td><td>'+(m.FeeAmount?'৳'+m.FeeAmount:'—')+'</td></tr>'; }).join('') +
    '</tbody></table>';
  PrintUtil.print('সদস্য তালিকা (' + list.length + ' জন)', html, '<span>মোট: ' + list.length + ' জন</span>');
}

// ===== এডিট মডাল =====
function openEdit(id) {
  const m = allMembers.find(function(x){ return x.ID === id; });
  if (!m) return;
  editPhotoDataUrl = '';
  document.getElementById('editModalRoot').innerHTML =
    '<div class="modal-backdrop" onclick="closeEdit(event)">' +
      '<div class="modal" style="max-width:500px;" onclick="event.stopPropagation()">' +
        '<h3>সদস্য এডিট করুন</h3>' +
        '<label>আইডি</label><input value="' + m.ID + '" disabled />' +
        '<div class="grid-2">' +
          '<div><label>নাম</label><input id="eName" value="' + (m.Name||'') + '" /></div>' +
          '<div><label>বাবার নাম</label><input id="eFather" value="' + (m.FatherName||'') + '" /></div>' +
          '<div><label>মায়ের নাম</label><input id="eMother" value="' + (m.MotherName||'') + '" /></div>' +
          '<div><label>গ্রাম</label><input id="eVillage" value="' + (m.Village||'') + '" /></div>' +
          '<div><label>জন্ম তারিখ</label><input id="eDob" type="date" value="' + (m.DOB||'') + '" /></div>' +
          '<div><label>শিক্ষা</label><input id="eEducation" value="' + (m.Education||'') + '" /></div>' +
          '<div><label>পেশা</label><input id="eOccupation" value="' + (m.Occupation||'') + '" /></div>' +
          '<div><label>রক্তের গ্রুপ</label><select id="eBlood">' +
            ['','A+','A-','B+','B-','AB+','AB-','O+','O-'].map(function(g){ return '<option value="'+g+'"'+(m.BloodGroup===g?' selected':'')+'>'+( g||'— নির্বাচন করুন —')+'</option>'; }).join('') +
          '</select></div>' +
          '<div><label>ধর্ম</label><select id="eReligion">' +
            ['','ইসলাম','হিন্দু','বৌদ্ধ','খ্রিস্টান','অন্যান্য'].map(function(r){ return '<option value="'+r+'"'+(m.Religion===r?' selected':'')+'>'+( r||'— নির্বাচন করুন —')+'</option>'; }).join('') +
          '</select></div>' +
          '<div><label>ফোন</label><input id="ePhone" value="' + (m.Phone||'') + '" /></div>' +
        '</div>' +
        '<label style="margin-top:14px;">ছবি বদলান</label>' +
        '<input type="file" accept="image/*" onchange="handleEditPhoto(event)" />' +
        (m.PhotoURL?'<img src="'+m.PhotoURL+'" id="editPhotoPreview" style="width:60px;height:60px;object-fit:cover;border-radius:50%;border:2px solid var(--brass);margin-top:8px;display:block;" />':'<img id="editPhotoPreview" style="display:none;width:60px;height:60px;object-fit:cover;border-radius:50%;border:2px solid var(--brass);margin-top:8px;" />') +
        '<label style="margin-top:14px;">চাঁদা (৳)</label><input id="eFee" type="number" value="' + (m.FeeAmount||0) + '" />' +
        '<div style="display:flex;gap:10px;margin-top:20px;">' +
          '<button class="btn brass" style="flex:1;" onclick="saveEdit(\'' + m.ID + '\')">সংরক্ষণ করুন</button>' +
          '<button class="btn outline" onclick="closeEdit()">বাতিল</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.style.overflow = 'hidden';
}

function closeEdit(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('editModalRoot').innerHTML = '';
  document.body.style.overflow = '';
}

function handleEditPhoto(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const s = 300;
      const canvas = document.createElement('canvas');
      canvas.width = s; canvas.height = s;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - min) / 2, sy = (img.naturalHeight - min) / 2;
      ctx.drawImage(img, sx, sy, min, min, 0, 0, s, s);
      editPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.82);
      const prev = document.getElementById('editPhotoPreview');
      prev.src = editPhotoDataUrl; prev.style.display = 'block';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveEdit(id) {
  const payload = {
    id,
    name:        document.getElementById('eName').value.trim(),
    fatherName:  document.getElementById('eFather').value.trim(),
    motherName:  document.getElementById('eMother').value.trim(),
    village:     document.getElementById('eVillage').value.trim(),
    dob:         document.getElementById('eDob').value,
    education:   document.getElementById('eEducation').value.trim(),
    occupation:  document.getElementById('eOccupation').value.trim(),
    bloodGroup:  document.getElementById('eBlood').value,
    religion:    document.getElementById('eReligion').value,
    phone:       document.getElementById('ePhone').value.trim(),
    feeAmount:   document.getElementById('eFee').value || 0,
    photo:       editPhotoDataUrl,
  };
  Toast.loading('সংরক্ষণ হচ্ছে...');
  const res = await Api.post('updateMember', payload);
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('সদস্যের তথ্য আপডেট হয়েছে ✓');
  closeEdit();
  loadMembers();
}

async function removeMember(id) {
  if (!await Dialog.confirm('আইডি ' + id + ' সদস্যকে মুছে ফেলতে চান?', { title:'সদস্য মুছে ফেলুন', okText:'হ্যাঁ, মুছুন' })) return;
  const res = await Api.post('deleteMember', { id });
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('সদস্য মুছে ফেলা হয়েছে।');
  loadMembers();
}

onAdminStateChange();
loadMembers();
</script>
</body>
</html>
