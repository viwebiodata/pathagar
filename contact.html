<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>যোগাযোগ — শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</title>
<link rel="stylesheet" href="css/style.css"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
.contact-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:start;}
@media(max-width:760px){.contact-grid{grid-template-columns:1fr;}}
.form-card,.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;}
.type-pills{display:flex;gap:10px;margin-top:6px;}
.type-pill{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;font-size:.92rem;font-weight:600;color:var(--muted);transition:all .2s;}
.type-pill.active.suggest{border-color:var(--sage);color:var(--sage);background:rgba(95,113,97,.08);}
.type-pill.active.complaint{border-color:var(--rust);color:var(--rust);background:rgba(196,112,90,.08);}
.info-card h3{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--ink);border-bottom:2px solid var(--rust);padding-bottom:8px;margin-bottom:16px;}
.info-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.93rem;color:var(--ink);text-decoration:none;}
.info-row:last-child{border-bottom:none;}
.info-row .lbl{color:var(--muted);font-size:.78rem;display:block;}
.social-row{display:flex;gap:10px;margin-top:14px;}
.social-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);text-decoration:none;transition:all .2s;}
.fb{color:#1877F2;}.fb:hover{background:#1877F2;color:#fff;border-color:#1877F2;}
.wa{color:#25D366;}.wa:hover{background:#25D366;color:#fff;border-color:#25D366;}
.xx{color:var(--ink);}.xx:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
</style>
</head>
<body>
<div id="navRoot"></div>
<main class="wrap" style="max-width:880px;">
  <div class="section-label">যোগাযোগ করুন</div>
  <p style="color:var(--muted);font-size:.92rem;margin-bottom:22px;">আপনার পরামর্শ বা অভিযোগ জানান।</p>
  <div class="contact-grid">
    <div class="form-card">
      <label>ধরন</label>
      <div class="type-pills">
        <div class="type-pill active suggest" id="pillSuggest" onclick="selectType('পরামর্শ')">💡 পরামর্শ</div>
        <div class="type-pill complaint" id="pillComplaint" onclick="selectType('অভিযোগ')">⚠️ অভিযোগ</div>
      </div>
      <label style="margin-top:14px;">আপনার নাম (ঐচ্ছিক)</label>
      <input id="cName" placeholder="আপনার নাম"/>
      <label>ফোন নম্বর <span style="color:var(--rust);">*</span></label>
      <input id="cPhone" type="tel" placeholder="০১XXXXXXXXX"/>
      <label>ইমেইল (ঐচ্ছিক)</label>
      <input id="cEmail" type="email" placeholder="you@example.com"/>
      <label>বিস্তারিত <span style="color:var(--rust);">*</span></label>
      <textarea id="cMessage" rows="5" placeholder="আপনার পরামর্শ বা অভিযোগ লিখুন..."></textarea>
      <button class="btn brass" style="margin-top:18px;width:100%;" onclick="submitContact()">পাঠিয়ে দিন</button>
    </div>
    <div class="info-card">
      <h3>যোগাযোগের ঠিকানা</h3>
      <a class="info-row" href="tel:+8801XXXXXXXXX">
        <span>📞</span><span><span class="lbl">ফোন</span>+৮৮০ ১XXX-XXXXXX</span>
      </a>
      <a class="info-row" href="mailto:info@example.com">
        <span>✉️</span><span><span class="lbl">ইমেইল</span>info@example.com</span>
      </a>
      <div class="info-row">
        <span>📍</span><span><span class="lbl">ঠিকানা</span>কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</span>
      </div>
      <div class="social-row">
        <a href="https://facebook.com/YOUR_PAGE" target="_blank" class="social-btn fb" title="Facebook">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.87h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94Z"/></svg>
        </a>
        <a href="https://wa.me/8801XXXXXXXXX" target="_blank" class="social-btn wa" title="WhatsApp">
          <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2c-5.5 0-9.96 4.46-9.96 9.96 0 1.76.46 3.45 1.33 4.95L2 22l5.25-1.38A9.9 9.9 0 0 0 12.05 24c5.5 0 9.96-4.46 9.96-9.96S17.54 2 12.04 2zm5.8 14.24c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36l.56.01c.18.01.42-.07.66.5l.9 2.14c.07.14.12.31.02.5l-.29.48-.43.5c-.14.14-.29.29-.13.57.17.29.75 1.24 1.61 2.01 1.11 1 2.05 1.31 2.33 1.46.29.14.46.12.63-.07.17-.19.72-.84.92-1.13.19-.29.38-.24.64-.14l1.94.92c.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg>
        </a>
        <a href="https://x.com/YOUR_HANDLE" target="_blank" class="social-btn xx" title="X">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.68L23.33 22H16.7l-5.18-6.77L5.6 22H2.5l8.13-9.29L1.5 2h6.8l4.68 6.19L18.9 2zm-1.16 18h1.7L7.35 3.9H5.53L17.74 20Z"/></svg>
        </a>
      </div>
    </div>
  </div>
</main>
<div id="adminModalRoot"></div>
<div class="footer">শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার · কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
renderNav('contact.html');
var _type = 'পরামর্শ';

// Google One Tap init
window.addEventListener('load', function() {
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.initialize({
      client_id: '1066861571538-3rim0oi9qeiejkfbhttg7la9khtgiehd.apps.googleusercontent.com',
      callback: function(response) {
        try {
          var parts = response.credential.split('.');
          var payload = JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
          if (payload.email) {
            document.getElementById('cEmail').value = payload.email;
            if (payload.name) document.getElementById('cName').value = payload.name;
            Toast.success('Google থেকে ইমেইল যোগ হয়েছে ✓');
          }
        } catch(e) { Toast.error('Google লগইন ব্যর্থ হয়েছে'); }
      },
      auto_select: false,
      cancel_on_tap_outside: true,
    });
  }
});

function tryGoogleAutofill() {
  if (window.google && google.accounts && google.accounts.id) {
    google.accounts.id.prompt(function(notification) {
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        // One Tap দেখাতে পারেনি — fallback: popup
        google.accounts.id.renderButton(
          document.getElementById('googleBtnWrap'),
          { theme: 'outline', size: 'medium', text: 'select_account', locale: 'bn' }
        );
        document.getElementById('googleBtnWrap').style.display = 'block';
      }
    });
  } else {
    Toast.warning('Google সংযুক্ত হয়নি — ইমেইল হাতে লিখুন।');
  }
}
function selectType(t) {
  _type = t;
  document.getElementById('pillSuggest').classList.toggle('active', t==='পরামর্শ');
  document.getElementById('pillComplaint').classList.toggle('active', t==='অভিযোগ');
}
async function submitContact() {
  var phone = document.getElementById('cPhone').value.trim();
  var msg   = document.getElementById('cMessage').value.trim();
  if (!phone) { Toast.error('ফোন নম্বর দিন'); return; }
  if (!msg)   { Toast.error('বিস্তারিত লিখুন'); return; }
  Toast.loading('পাঠানো হচ্ছে...');
  var res = await Api.post('addContactMessage', {
    type: _type,
    name: document.getElementById('cName').value.trim(),
    phone: phone,
    email: document.getElementById('cEmail').value.trim(),
    message: msg,
  });
  if (res && res.error) { Toast.error(res.error); return; }
  Toast.success('ধন্যবাদ! আপনার বার্তা পৌঁছে গেছে ✓');
  ['cName','cPhone','cEmail','cMessage'].forEach(function(id){ document.getElementById(id).value=''; });
}
</script>
</body>
</html>
