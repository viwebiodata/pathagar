<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>নোটিশ — শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার</title>
<link rel="stylesheet" href="css/style.css" />
<style>
/* নোটিশ কার্ড */
.notice-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 4px solid var(--brass);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  transition: box-shadow 0.15s, transform 0.15s;
  cursor: pointer;
}
.notice-card:hover {
  box-shadow: 0 6px 20px rgba(28,43,57,.12);
  transform: translateY(-2px);
}
.notice-card-header {
  display: flex;
  gap: 14px;
  padding: 16px 18px;
  align-items: flex-start;
}
.notice-card-thumb {
  width: 72px; height: 72px; flex-shrink: 0;
  object-fit: cover; border-radius: var(--radius);
  border: 1px solid var(--line);
}
.notice-card-thumb-placeholder {
  width: 72px; height: 72px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--line), var(--paper));
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem;
}
.notice-card-body { flex: 1; min-width: 0; }
.notice-card-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: .7rem; color: var(--muted); margin-bottom: 4px;
}
.notice-card-title {
  font-family: 'Fraunces', serif;
  font-size: 1.05rem; font-weight: 600;
  color: var(--ink); margin-bottom: 6px;
}
.notice-card-preview {
  font-size: .87rem; color: var(--muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.notice-card-footer {
  padding: 10px 18px 12px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px dashed var(--line);
  font-size: .82rem;
}
.notice-read-btn {
  color: var(--brass-dark); font-weight: 600;
  font-size: .85rem; display: flex; align-items: center; gap: 4px;
}

/* নোটিশ ডিটেইল মডাল */
.notice-modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(28,43,57,.65);
  backdrop-filter: blur(4px);
  z-index: 8000;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  animation: _tin .2s ease;
}
.notice-modal {
  background: var(--card);
  border-radius: 12px;
  width: 100%; max-width: 680px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(0,0,0,.35);
  animation: _tin .25s cubic-bezier(.34,1.56,.64,1);
  -webkit-overflow-scrolling: touch;
}
.notice-modal-hero {
  width: 100%; max-height: 280px;
  object-fit: cover; display: block;
  border-radius: 12px 12px 0 0;
}
.notice-modal-body { padding: 24px 26px 28px; }
.notice-modal-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: .72rem; color: var(--muted); margin-bottom: 8px;
}
.notice-modal-title {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem; font-weight: 700;
  color: var(--ink); margin-bottom: 16px; line-height: 1.35;
}
.notice-modal-content {
  font-family: 'Hind Siliguri', sans-serif;
  font-size: .97rem; line-height: 1.85;
  color: var(--text);
  white-space: pre-line;
}
.notice-modal-actions {
  display: flex; gap: 10px; margin-top: 20px;
  padding-top: 16px; border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.notice-modal-close {
  position: sticky; top: 12px; float: right;
  margin: 12px 12px 0 0;
  background: rgba(28,43,57,.7); color: #fff;
  border: none; border-radius: 50%;
  width: 36px; height: 36px;
  font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  z-index: 1;
}
</style>
</head>
<body>
<div id="navRoot"></div>

<main class="wrap" style="max-width:760px;">
  <div class="page-toolbar">
    <div class="section-label">নোটিশ বোর্ড</div>
    <div id="refreshBtnRoot"></div>
  </div>

  <!-- অ্যাডমিন ফর্ম -->
  <div id="adminBlock" class="admin-only-block" style="display:none;">
    <span class="admin-badge">নতুন নোটিশ প্রকাশ করুন</span>
    <label>শিরোনাম</label>
    <input id="nTitle" placeholder="নোটিশের শিরোনাম" />
    <label>বিস্তারিত</label>
    <textarea id="nContent" rows="5" style="resize:vertical;"></textarea>
    <label style="margin-top:14px;">ছবি (ঐচ্ছিক — গ্যালারিতেও যুক্ত হবে)</label>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;">
      <label class="btn outline" style="cursor:pointer;margin:0;">
        📷 ছবি যোগ করুন
        <input type="file" accept="image/*" id="nPhotoInput" style="display:none;" onchange="handleNoticePhoto(event)" />
      </label>
      <span id="nPhotoName" style="font-size:.82rem;color:var(--muted);"></span>
    </div>
    <img id="nPhotoPreview" style="display:none;width:140px;height:100px;object-fit:cover;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;" />
    <button class="btn brass" style="margin-top:18px;" onclick="addNotice()">প্রকাশ করুন</button>
  </div>

  <!-- নোটিশ তালিকা -->
  <div id="noticesList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">এখনো কোনো নোটিশ নেই।</div>
</main>

<!-- নোটিশ ডিটেইল মডাল -->
<div id="noticeModalRoot"></div>
<div id="adminModalRoot"></div>
<div class="footer">শহীদ আইয়ুব আলী স্মৃতি সংঘ ও পাঠাগার · কুলানন্দপুর, বলগাড়ী, ঘোড়াঘাট, দিনাজপুর</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
renderNav('notices.html');
renderRefreshBtn(loadNotices);

let allNotices = [];

function onAdminStateChange() {
  document.getElementById('adminBlock').style.display = (isAdmin() || Can.editNotices()) ? 'block' : 'none';
}

// ===== নোটিশ লোড =====
async function loadNotices() {
  allNotices = await Api.get('listNotices') || [];
  const el    = document.getElementById('noticesList');
  const empty = document.getElementById('emptyState');
  if (!allNotices.length) { el.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  el.innerHTML = allNotices.map(function(n) {
    const thumb = n.ImageURL
      ? '<img class="notice-card-thumb" src="' + n.ImageURL + '" alt="" />'
      : '<div class="notice-card-thumb-placeholder">📢</div>';
    const preview = (n.Content || '').replace(/<[^>]+>/g, '').slice(0, 120);
    const adminBtns = isAdmin()
      ? '<button class="btn small" style="background:var(--rust);" onclick="event.stopPropagation();removeNotice(\'' + n.ID + '\')">ডিলিট</button>'
      : '';
    return '<div class="notice-card" onclick="openNotice(\'' + n.ID + '\')">' +
      '<div class="notice-card-header">' + thumb +
        '<div class="notice-card-body">' +
          '<div class="notice-card-date">' + fmtDate(n.Date) + '</div>' +
          '<div class="notice-card-title">' + n.Title + '</div>' +
          '<div class="notice-card-preview">' + preview + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="notice-card-footer">' +
        '<span class="notice-read-btn">📖 বিস্তারিত পড়ুন →</span>' +
        '<div onclick="event.stopPropagation();">' +
          '<button class="btn small outline" onclick="ShareUtil.show(this.dataset.t,\'📢 \'+this.dataset.t+\' — শহীদ আইয়ুব আলী পাঠাগার\')" data-t="' + n.Title.replace(/"/g, '&quot;') + '" data-id="' + n.ID + '">🔗 শেয়ার</button>' +
          ' ' + adminBtns +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ===== নোটিশ মডাল =====
function openNotice(id) {
  const n = allNotices.find(function(x) { return x.ID === id; });
  if (!n) return;

  const heroImg = n.ImageURL
    ? '<img class="notice-modal-hero" src="' + n.ImageURL + '" alt="' + n.Title + '" />'
    : '';

  document.getElementById('noticeModalRoot').innerHTML =
    '<div class="notice-modal-backdrop" id="nBackdrop" onclick="closeNotice(event)">' +
      '<div class="notice-modal">' +
        '<button class="notice-modal-close" onclick="closeNotice()">✕</button>' +
        heroImg +
        '<div class="notice-modal-body">' +
          '<div class="notice-modal-date">' + fmtDate(n.Date) + '</div>' +
          '<div class="notice-modal-title">' + n.Title + '</div>' +
          '<div class="notice-modal-content">' + (n.Content || '') + '</div>' +
          '<div class="notice-modal-actions">' +
            '<button class="btn outline" onclick="closeNotice()">← ফিরে যান</button>' +
            '<button class="btn outline" onclick="ShareUtil.show(\'' + n.Title.replace(/'/g, "\\'") + '\',\'📢 ' + n.Title.replace(/'/g, "\\'") + ' — শহীদ আইয়ুব আলী পাঠাগার\')">🔗 শেয়ার করুন</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.body.style.overflow = 'hidden';
  history.pushState({notice: id}, '', window.location.pathname + '?id=' + id);

  // ESC key
  document.addEventListener('keydown', noticeKeyHandler);
}

function closeNotice(e) {
  if (e && e.target && e.target.id !== 'nBackdrop' && !e.target.classList.contains('notice-modal-close')) return;
  document.getElementById('noticeModalRoot').innerHTML = '';
  document.body.style.overflow = '';
  history.pushState(null,'',window.location.pathname);
  document.removeEventListener('keydown', noticeKeyHandler);
}

function noticeKeyHandler(e) {
  if (e.key === 'Escape') closeNotice({ target: { id: 'nBackdrop' } });
}

// ===== নোটিশ যোগ =====
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const MAX_W = 1600, MAX_H = 1200;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
      if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      const mp = (w * h) / 1000000;
      callback(canvas.toDataURL('image/jpeg', mp > 2 ? 0.78 : 0.88));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

let _noticePhotoDataUrl = '';
function handleNoticePhoto(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  document.getElementById('nPhotoName').textContent = file.name;
  compressImage(file, function(dataUrl) {
    _noticePhotoDataUrl = dataUrl;
    const prev = document.getElementById('nPhotoPreview');
    prev.src = dataUrl; prev.style.display = 'block';
  });
}

async function addNotice() {
  const payload = {
    title:   document.getElementById('nTitle').value.trim(),
    content: document.getElementById('nContent').value.trim(),
    image:   _noticePhotoDataUrl,
  };
  if (!payload.title) { Toast.error('শিরোনাম দিন'); return; }
  Toast.loading('নোটিশ প্রকাশ হচ্ছে...');
  const res = await Api.post('addNotice', payload);
  if (res.error) { Toast.error(res.error); return; }
  Toast.success('নোটিশ সফলভাবে প্রকাশিত হয়েছে ✓');
  document.getElementById('nTitle').value = '';
  document.getElementById('nContent').value = '';
  document.getElementById('nPhotoInput').value = '';
  document.getElementById('nPhotoPreview').style.display = 'none';
  document.getElementById('nPhotoName').textContent = '';
  _noticePhotoDataUrl = '';
  loadNotices();
}

async function removeNotice(id) {
  if (!await Dialog.confirm('নোটিশটি মুছে ফেলতে চান?')) return;
  await Api.post('deleteNotice', { id });
  Toast.success('নোটিশ মুছে ফেলা হয়েছে।');
  loadNotices();
}

onAdminStateChange();
loadNotices().then(function() {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if (id) {
    var n = allNotices.find(function(x){ return x.ID === id; });
    if (n) openNotice(n.ID);
  }
});
</script>
</body>
</html>
